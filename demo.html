<main id="demo" class="demo open" aria-label="PackPal interactive demo"><div class="demobox"><div class="demotop"><div><strong style="font-size:23px">🐾 PackPal demo</strong><div class="hint">Fictional sample data · Saved in this browser</div></div><a href="index.html" class="close back-link">← Back to website</a></div><div class="tabs"><button data-tab="bookings" class="active">📅 Bookings</button><button data-tab="today">🐕 Today</button><button data-tab="pupdate">💌 Pupdate</button></div><div id="demoContent"></div></div></main>
<script>
(()=>{'use strict';const KEY='locaPackPalAlpha1';const iso=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const add=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const format=d=>new Date(d+'T12:00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'});const sample=[['Biscuit','Aoife',90,[0,1,3]],['Luna','Cian',8,[0,2]],['Milo','Niamh',-4,[0,4]],['Poppy','Eoin',12,[1,2]],['Teddy','Sara',180,[0,5]],['Daisy','Jack',2,[2,3]],['Ollie','Maya',75,[3,4]],['Ruby','Finn',0,[0,6]],['Archie','Leah',35,[1,5]],['Maple','Conor',120,[2,6]]];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.dogs))state={dogs:sample.map((d,i)=>({id:'d'+i,name:d[0],owner:d[1],vax:add(iso(),d[2]),days:d[3].map(n=>add(iso(),n)),notes:{}})),date:iso(),owner:'d0',checked:[]};state.dogs.forEach(d=>d.notes=d.notes||{});state.checked=state.checked||[];let tab='bookings';const root=document.getElementById('demo'),out=document.getElementById('demoContent');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const dog=id=>state.dogs.find(d=>d.id===id),booked=date=>state.dogs.filter(d=>d.days.includes(date)),room=date=>Math.max(0,40-booked(date).length);const vax=d=>{const days=Math.floor((new Date(d.vax+'T12:00:00')-new Date(iso()+'T12:00:00'))/86400000);return days<0?['red','Expired',true]:days<=14?['amber',days===0?'Expires today':`Due in ${days} days`,false]:['ok','In date',false]};const notes=[['ate','🍽️','Ate'],['walked','🦮','Walked'],['played','🎾','Played'],['napped','💤','Napped']];const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){root.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='bookings')renderBookings();else if(tab==='today')renderToday();else renderPupdate()}function renderBookings(){const day=state.date,weekday=(new Date(day+'T12:00:00').getDay()+6)%7,mon=add(day,-weekday),dates=Array.from({length:7},(_,i)=>add(mon,i));out.innerHTML=`<div class="demopanel"><h3>Bookings · 40 places per day</h3><p class="hint">Select a day and a dog. Expired vaccinations block bookings.</p><div class="demogrid">${dates.map(d=>`<button class="demoday ${d===day?'selected':''}" data-date="${d}"><b>${format(d).split(' ')[0]}</b><small>${room(d)} left</small></button>`).join('')}</div><p><b>${booked(day).length} booked · ${room(day)} places left</b></p><label>Dog<select id="bookingDog" class="formfield"><option value="">Choose a dog</option>${state.dogs.map(d=>`<option value="${d.id}">${safe(d.name)}</option>`).join('')}</select></label><label>Date<input type="date" id="bookingDate" class="formfield" value="${day}"></label><button id="addBooking" class="btn">＋ Add booking</button><div id="bookingResult" role="status"></div><h3>Booked dogs</h3>${booked(day).map(d=>`<div class="demoitem"><b>${safe(d.name)}</b> · ${safe(d.owner)} <span class="vax ${vax(d)[0]}">${vax(d)[1]}</span></div>`).join('')||'<p class="hint">No bookings for this day.</p>'}</div>`;out.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.date=b.dataset.date;save();render()});document.getElementById('bookingDate').onchange=e=>{if(e.target.value){state.date=e.target.value;save();render()}};document.getElementById('addBooking').onclick=()=>{const d=dog(document.getElementById('bookingDog').value),date=document.getElementById('bookingDate').value,msg=document.getElementById('bookingResult');let text;if(!d||!date)text='Choose a dog and date.';else if(vax(d)[2])text=`Booking blocked: ${d.name} has an expired vaccination.`;else if(d.days.includes(date))text=`${d.name} is already booked.`;else if(room(date)===0){let next;for(let i=1;i<=14;i++)if(room(add(date,i))>0){next=add(date,i);break}text=next?`Full day. Nearest day with room: ${format(next)}.`:'No available day in the next 14 days.'}else{d.days.push(date);state.date=date;save();render();return}msg.innerHTML='<div class="demomsg">'+safe(text)+'</div>'}}function renderToday(){const date=iso(),dogs=booked(date);out.innerHTML=`<div class="demopanel"><h3>Today · ${format(date)}</h3><p class="hint">Red = expired (check-in blocked). Amber = expires within 14 days. Tap a note once to save.</p>${dogs.map(d=>{const v=vax(d),k=date+':'+d.id,checked=state.checked.includes(k),added=d.notes[date]||[];return `<div class="demoitem"><header><div><b>🐶 ${safe(d.name)}</b><div class="hint">${safe(d.owner)}</div></div><button data-check="${d.id}" class="close" ${v[2]?'disabled':''}>${v[2]?'Blocked':checked?'✓ Checked in':'Check in'}</button></header><p><span class="vax ${v[0]}">💉 ${v[1]}</span></p><div class="notebuttons">${notes.map(([k,e,label])=>`<button data-dog="${d.id}" data-note="${k}" class="${added.includes(k)?'on':''}">${e}<br>${label}</button>`).join('')}</div></div>`}).join('')}</div>`;out.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const d=dog(b.dataset.check),k=date+':'+d.id;if(vax(d)[2])return;state.checked=state.checked.includes(k)?state.checked.filter(x=>x!==k):[...state.checked,k];save();render()});out.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const d=dog(b.dataset.dog),k=b.dataset.note;d.notes[date]=d.notes[date]||[];d.notes[date]=d.notes[date].includes(k)?d.notes[date].filter(x=>x!==k):[...d.notes[date],k];save();render()})}function renderPupdate(){const d=dog(state.owner)||state.dogs[0],added=d.notes[iso()]||[];out.innerHTML=`<div class="demopanel"><h3>💌 Pupdate</h3><p class="hint">Staff preview: select one fictional owner. Real owner authentication is planned.</p><label>Preview dog<select id="ownerSelect" class="formfield">${state.dogs.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${safe(x.name)} · ${safe(x.owner)}</option>`).join('')}</select></label><h3>🐶 ${safe(d.name)}'s day</h3><p class="hint">${safe(d.owner)} · ${format(iso())}</p>${added.length?added.map(k=>{const n=notes.find(x=>x[0]===k);return `<div class="demoitem">${n[1]} <b>${n[2]}</b> · Today</div>`}).join(''):'<div class="demomsg">No updates yet. Staff can add notes in Today.</div>'}<p class="hint">Only this dog's notes are shown in this view.</p></div>`;document.getElementById('ownerSelect').onchange=e=>{state.owner=e.target.value;save();render()}}root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render()})();
